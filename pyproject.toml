[project]
name = "sma"
version = "0.1.0"
description = "SMA: Small Model Arena launcher. Fetch a pinned Hugging Face checkpoint, serve it with vLLM, and record benchmarks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "iamMrDuncan" }]
dependencies = [
  "httpx>=0.27",
  "huggingface_hub>=0.26",
  "jsonschema>=4.23",
  "pyyaml>=6.0",
  "tokenizers>=0.20",
]

[project.optional-dependencies]
quality = ["lm-eval>=0.4.4"]
dev = ["pytest>=8.0"]

[project.scripts]
sma = "sma.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sma"]

[tool.hatch.build.targets.wheel.sources]
"src/sma" = "sma"

[tool.hatch.build.targets.wheel.force-include]
"schemas/manifest.schema.json" = "sma/schemas/manifest.schema.json"
"schemas/summary.schema.json" = "sma/schemas/summary.schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
