# SMA defaults for one DGX Spark. Values here are the contract the dry-run prints.
# SMA never quantizes. Point it at the checkpoint that already has the quant you name.
# Do not put a hostname or a token in this file. host_alias is published; the HF token
# comes from the HF_TOKEN environment variable.

schema_version: 1
host_alias: gpu-host-1
runs_dir: runs
seed: 0
lock_path: ~/.local/share/sma/locks/gpu.lock

hf:
  cache_dir: ~/.cache/sma/hf
  token_env: HF_TOKEN
  download_timeout_s: 3600

engine:
  # The default engine for safetensors checkpoints: vllm, or sglang (also --engine sglang). GGUF files
  # (--gguf) always run on llama.cpp. See docs/serving-design.md.
  name: vllm
  # Spark playbook tag. Pin engine.image_digest after the first pull.
  # SMA records whatever digest docker inspect returns. It does not invent one.
  # Later starts of the same run use that digest, not a floating tag.
  image: nvcr.io/nvidia/vllm:26.05.post1-py3
  image_digest: null
  # Versioned multi-arch CUDA 13 tag for DGX Spark (arm64). Do not pin latest-cu130.
  sglang_image: lmsysorg/sglang:v0.5.10.post1-cu130
  sglang_image_digest: null
  # SM12x requires FlashInfer attention. Deterministic quality mode disables the radix cache.
  sglang_attention_backend: flashinfer
  sglang_determinism_backend: flashinfer
  # DeepGEMM in the pinned SGLang image does not support the GB10 (SM121). Deterministic serving
  # crashes at CUDA-graph capture ("Unsupported architecture") unless it is off.
  sglang_disable_deep_gemm: true
  # llama.cpp for GGUF files: the "full" image has llama-server and llama-perplexity. Versioned
  # arm64 + CUDA 13 build with SM 12.1 kernels. The run records the digest and llama.cpp's build.
  llamacpp_image: ghcr.io/ggml-org/llama.cpp:full-cuda13-b11913
  llamacpp_image_digest: null
  # llama-server's host-RAM prompt cache in MiB (--cache-ram; llama.cpp's own default). The memory
  # plan counts it. 0 turns it off.
  llamacpp_cache_ram_mib: 8192
  port: 8000
  bind_host: 127.0.0.1
  gpus: all
  shm_size: 16g
  # vLLM's startup free-memory check and SGLang's static memory share. The memory plan below sizes
  # the KV pool and the context per stream; this share no longer decides them.
  gpu_memory_utilization: 0.90
  # At least the largest determinism batch (64).
  max_num_seqs: 64
  # Explicit MoE backend for NVFP4 and MXFP4. Auto-selection can land on Marlin.
  moe_backend: flashinfer_b12x
  moe_backend_fallbacks:
    - marlin
  # Dense NVFP4 only, set as VLLM_NVFP4_GEMM_BACKEND (vLLM 0.21 has no --linear-backend flag).
  # Recorded in the manifest's env.
  linear_backend: flashinfer_b12x
  batch_invariant: true
  no_flashinfer_autotune_quality: true
  # Batch invariance does not hold while async scheduling composes the next batch.
  no_async_scheduling_with_batch_invariant: true
  trust_remote_code: false
  # The engine's parser for the model's tool calls (vLLM --tool-call-parser), for example hermes for
  # Qwen3, llama3_json for Llama 3. It depends on the model, so pass --tool-parser per run. null
  # serves no tools, and quality suites with tools: true record a null score with the reason.
  tool_call_parser: null
  # The engine's parser that moves a thinking model's reasoning out of the answer: vLLM and SGLang
  # --reasoning-parser (qwen3 for LFM3 on SGLang). llama.cpp does it with --jinja. null passes none.
  reasoning_parser: null
  extra_args: []
  server_stop_timeout_s: 30
  clock_cap_mhz: null
  apply_clock_cap: false
  container_prefix: sma

memory:
  # A run's planned footprint (weights + KV pool + engine overhead) stays under this many GB.
  # The Spark has 130.7 GB; earlyoom stops vllm and python processes under 8% free.
  budget_gb: 100
  # Context per stream starts here (256K), or at the model's native maximum if smaller, never
  # RoPE-stretched, and halves until one stream fits. Each benchmark then gets the largest step
  # that fits the streams it runs at once. The KV cache is always 8-bit: FP8, or Q8_0 on llama.cpp.
  start_context: 262144
  # Run memory beyond weights and KV pool, in GB: the engine's activations, CUDA graphs, and server
  # processes, plus SMA's tools beside it (nel, the bench client). Measured on a Spark: vLLM peaked
  # 8.9 GB above weights + pool with Qwen3-0.6B and 11.4 GB with Qwen3-8B NVFP4 (docs/first-spark-run.md).
  overhead_gb:
    vllm: 13.0
    sglang: 13.0
    llamacpp: 3.0
  # llama.cpp sizes its compute buffers by its whole KV cache, so its pool holds its slots at the context
  # per stream and no more, and the plan counts those buffers per token (src/sma/runplan.py). Its prompt
  # cache (engine.llamacpp_cache_ram_mib) is counted on top.
  # The least context per stream quality may get, the ladder's floor for its streams. Answers have no
  # length limit (quality.max_tokens null), so quality gets the largest step that fits.
  quality_min_context: 8192
  # If the Spark's available memory falls under this many GB, SMA kills this run's containers at once; the
  # running step fails and says why. GPU memory on a GB10 is charged to no process and earlyoom only sends
  # SIGTERM, so neither stopped the 2026-10-28 crash. 0 turns it off.
  guard_free_gb: 12

timeouts:
  server_start_s: 900
  health_request_s: 5
  health_poll_s: 2
  command_s: 120
  bench_s: 7200
  # One quality suite in all. Answers have no length limit, and a thinking model on BFCL's 4,441 questions
  # can take many hours; this only stops a suite that hangs.
  eval_s: 86400
  docker_s: 300
  # Cold pulls of the arm64 CUDA images are large. This is not the short inspect timeout.
  image_pull_s: 3600
  metrics_s: 10
  logprob_request_s: 600

retries:
  attempts: 3
  backoff_s: 2.0
  backoff_factor: 2.0

determinism:
  prompts:
    - "The capital of France is"
    - "2 + 2 ="
    - "def add(a, b):\n    return"
  batch_sizes: [1, 8, 64]
  max_tokens: 32
  temperature: 0

logprobs:
  top_k: 64
  window_tokens: 2048
  # 48 x 2048 = 98304 scored tokens when the tokenizer yields that many.
  num_windows: 48
  corpus_version: sma-corpus-v3
  # llama.cpp only: llama-server returns no prompt logprobs, so llama-perplexity scores this many
  # chunks of window_tokens. A full-precision GGUF run writes its logits for a quant's KL: about
  # chunks * 1023 tokens * vocabulary * 2 bytes (2.5 GB for 8 chunks of a 152K vocabulary).
  llamacpp_chunks: 8

quality:
  enabled: true
  # NVIDIA NeMo Evaluator (nel, from the quality extra) runs each suite against the quality server's
  # chat API. Requests in flight per suite. Recorded.
  concurrency: 8
  executable: nel
  # Output tokens per answer. null sends no limit: an answer may use all the context its stream has left,
  # which the memory plan sets (owner decision 2026-10-29). With 4,096, LFM3-1.7B ran out on 30% of its
  # MMLU-Pro answers and 60% of its GPQA answers with thinking off. scores.json counts the answers that
  # stop at the limit (answers_cut_off).
  max_tokens: null
  # One request to the model server, for nel's proxy and its model client alike (nemo-evaluator 0.3.0 fixes the
  # client at 120 s; SMA raises it). Long enough for an answer that fills a 256K context at 20 tok/s per
  # stream. Failed requests are retried retries.attempts times in all.
  request_timeout_s: 14400
  # Each run has a thinking mode (owner decision 2026-10-29): sma run ... --thinking off (the default) or
  # --thinking on. Off: thinking off, greedy at this temperature. On: thinking on, no temperature sent, so
  # the engine applies the model's own sampling (generation_config.json, or a GGUF's general.sampling
  # metadata). The mode also sets enable_thinking for KernelBench, SWE-bench, and BrowseComp-Plus.
  temperature: 0.0
  # Merged into every request body and set as the quality server's default. The thinking mode adds
  # enable_thinking; it cannot be set here. Templates that do not read it ignore it.
  chat_template_kwargs: {}
  # bench is a nel benchmark: a built-in name, lm-eval://<task> (generative tasks only), or
  # sma:<name> for a file in src/sma/nel_benchmarks/. It defaults to the suite name. limit picks
  # that many questions by a seeded shuffle of the whole dataset, the same ones for every model.
  # Clear a limit to run the whole dataset. These are not the arena's pinned bench scorers.
  suites:
    # Owner decision 2026-10-29: IFEval all 541 prompts, GSM8K 150 of 1,319, GPQA Diamond all 198. At 20
    # GPQA questions LFM3-1.7B's BF16 and Q4 intervals (20-60%, 10-45%) could not tell them apart.
    - name: ifeval
      bench: lm-eval://ifeval
      limit: null
      questions: 541
    # Both GSM8K graders in nemo-evaluator 0.3.0 mark answers wrongly. SMA ships nel's prompt with a
    # numeric answer check.
    - name: gsm8k
      bench: sma:gsm8k
      limit: 150
    - name: mmlu_pro
      limit: 700
    # GPQA Diamond. The dataset (Idavidrein/gpqa) is gated: accept its terms with the HF account.
    - name: gpqa_diamond
      bench: gpqa
      limit: null
      questions: 198
    # MuSiQue-Ans (owner decision 2026-10-28): multi-hop questions, each with its own 17 to 20 Wikipedia
    # paragraphs, answered in one reply and scored by rule with MuSiQue's answer F1 (exact match is kept too).
    # The dev split, from a mirror checked against the official file. See src/sma/nel_benchmarks/musique.py.
    - name: musique
      bench: sma:musique
      limit: 100
      metric: answer_f1
    # BFCL v3 (Berkeley Function Calling Leaderboard): single-turn, live, and multi-turn tool calls
    # through the chat API with native tool calling. NVIDIA's container runs it directly, not through
    # nel, so SMA keeps one row per question. All 4,441 questions run; the container cannot sample.
    # Needs the server's tool-call parser: pass --tool-parser (hermes for Qwen3 on vLLM).
    - name: bfcl_v3
      image: nvcr.io/nvidia/eval-factory/bfcl:26.03
      task: bfclv3_ast
      tools: true
      # The dataset's size inside the container, for `sma watch`'s answered/total only.
      questions: 4441
    # LiveCodeBench (owner decision 2026-10-29: it replaces SWE-bench, which was too slow). One answer per
    # contest problem, scored by running the problem's hidden tests in NVIDIA's container; the headline is
    # pass@1. The window is LiveCodeBench's leaderboard default for release v6, August 2024 to May 2025.
    # LiveCodeBench has no problems after April 2025, so models trained since may have seen these. The
    # container sends temperature, top_p, and an answer limit itself, so SMA sets them for the run's thinking
    # mode (sampling: true). It downloads the dataset (4.5 GB) into hf.cache_dir/eval-factory once.
    - name: livecodebench
      image: nvcr.io/nvidia/eval-factory/livecodebench:26.03
      task: codegeneration_release_v6
      sampling: true
      params:
        extra:
          n_samples: 1
          start_date: "2024-08-01"
          end_date: "2025-05-01"
      # 454 problems in the window (110 easy, 141 medium, 203 hard), counted with the container's own loader.
      questions: 454

# KernelBench Level 1 (owner decision 2026-10-27). The model writes a kernel for each of the 100
# problems with KernelBench's own one-shot CUDA prompt. A separate GB10 compiles, checks, and times them
# (services/kernelbench); its URL is KERNELBENCH_URL in the root .env. The headline is fast_1: correct
# and faster than eager PyTorch. Requests use the model's own sampling and thinking mode, not
# KernelBench's temperature 0. Off: the run has no KernelBench suite.
kernelbench:
  enabled: true
  level: 1
  concurrency: 8
  # Output tokens per answer, reasoning included. null: the server's context per stream minus 4,096 for
  # the prompt, as for quality (owner decision 2026-10-29).
  max_tokens: null
  request_timeout_s: 14400
  # The service's evaluation options; empty uses its defaults, which match its stored baselines.
  options: {}
  poll_s: 60
  wait_s: 21600

# SWE-bench is off (owner decision 2026-10-29): a run spent most of its time there, and small models
# mostly hit the step limit. LiveCodeBench, a quality suite, replaces it. The code stays; enabled: true
# brings it back.
# SWE-bench Verified-mini (50 tasks) with mini-swe-agent's swebench.yaml on the x86_64 runner
# (services/swe-runner), reached over SSH with SWE_RUNNER_HOST, SWE_RUNNER_USER, and SWE_RUNNER_SSH_KEY
# from the root .env. 8 agents (owner decision 2026-10-29; 4 before: the model was the bottleneck, and
# 4 agents left the GPU at a quarter of its throughput) and 250 steps (2026-10-27), the model's own
# sampling and thinking mode. The agent acts through a bash tool call, so the run needs --tool-parser.
swebench:
  enabled: false
  workers: 8
  step_limit: 250
  # Each agent's stream gets the largest step of the context ladder that fits all of them, at least this.
  min_context: 32768
  remote_dir: sma-swe
  subset: data/verified-mini
  dataset_file: data/verified-mini.jsonl
  split: test
  agent_config: swebench.yaml
  grade_workers: 4
  grade_timeout_s: 1800
  poll_s: 60
  agent_wait_s: 43200
  grade_wait_s: 7200

# BrowseComp-Plus (owner decision 2026-10-28): deep research over a fixed set of 100,195 web documents.
# The model answers 100 of its 830 questions (a seeded shuffle, the same for every model) by calling a
# BM25 search tool, as BrowseComp-Plus's chat client does at 04694903: top 5 hits, each cut to 512
# tokens, one 20,000-token output budget per question, up to 100 replies, the model's own sampling and
# thinking mode. The index and its search server live on the x86_64 runner (services/browsecomp-plus,
# the SWE_RUNNER_* machine), so the document store takes nothing from the Spark; SMA reaches it through
# an SSH forward. After speed, the judge grades each answer with BrowseComp-Plus's grader prompt:
# SMA_JUDGE_URL and SMA_JUDGE_API_KEY in the root .env. The headline is accuracy over the 100; evidence
# recall and search calls need no judge. Needs --tool-parser.
browsecomp:
  enabled: true
  limit: 100
  workers: 4
  min_context: 32768
  max_tokens: 20000
  max_iterations: 100
  k: 5
  snippet_max_tokens: 512
  request_timeout_s: 1800
  remote_dir: sma-bcp
  search_port: 8790
  local_port: 8790
  search_start_s: 600
  # Ornith 1.5 122B on the lab's V100s (judge-info.md), with thinking off at temperature 0, as
  # BrowseComp-Plus runs its own judge. Scores are compared only within one judge. llama.cpp is not
  # batch-invariant, so the judge gets one request at a time and no prompt cache (judge-info.md section 6).
  judge_model: ornith-1.5-122b
  judge_max_tokens: 4096
  judge_temperature: 0.0
  judge_extra_body:
    chat_template_kwargs:
      enable_thinking: false
    cache_prompt: false
  judge_concurrency: 1
  judge_timeout_s: 900

speed:
  warmup_requests: 4
  warmup_max_tokens: 8
  warmup_soak_s: 30
  num_prompts: 32
  # The arena plan asks for at least 3 repeats. v0 defaults to 1. Raise this
  # when you want the repeat rule.
  repeats: 1
  percentile_metrics: ttft,tpot,itl,e2el
  metric_percentiles: 50,90,99
  derive_stat: p50
  throttle_retries: 1
  prefill:
    name: prefill
    input_len: 2048
    output_len: 64
  decode:
    name: decode
    input_len: 128
    output_len: 512
  sweep:
    name: sweep
    input_len: 1024
    output_len: 256
  sweep_concurrency: [1, 4, 8]

telemetry:
  interval_s: 1.0
  # The engine's /metrics counters (prompt and generated tokens and their seconds, and TTFT and ITL where
  # the engine has them) go to engine_metrics.jsonl this often while a server is up. `sma watch` averages
  # them over the last 5 minutes, hour, and 24 hours.
  engine_metrics_interval_s: 15
  idle_until_cool_c: 55
  idle_timeout_s: 600
  poll_s: 5
  drop_page_cache: true
  cool_between_legs: true
  # Spark spec constants used only to label a bandwidth ceiling. Not measurements.
  spec_bandwidth_gbps: 273
  spec_usable_gb: 115
  # GB10 sits near ~140 W. A steady sw_power_cap flag is recorded either way.
  # It invalidates a speed cell only when this is true.
  sw_power_cap_invalidates: false
  # Do not trapezoid across holes longer than this. Windows are integrated separately.
  max_sample_gap_s: 2.5
  # A speed cell is unverified unless it has about this fraction of duration/interval samples.
  min_sample_ratio: 0.8

queue:
  # One directory shared by up to three Sparks, or a private directory per Spark.
  # Claims use atomic link, so the directory must be one filesystem.
  dir: ~/.local/share/sma/queue
  poll_s: 5
  stale_claim_s: 3600
  heartbeat_s: 30
  claim_grace_s: 30
  # A failed job is marked failed and the worker continues. Raise this to retry.
  max_attempts: 1
  # Retries wait, then sort behind jobs that have not failed.
  retry_backoff_s: 30
  retry_backoff_factor: 2

doctor:
  min_free_gb: 20
  gpu_index: 0
